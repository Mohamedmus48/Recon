name: VHost Recon (bbot + Auto ASN + ffuf)

# يعمل يدويًا من تبويب Actions - يأخذ الدومين فقط
on:
  workflow_dispatch:
    inputs:
      domain:
        description: "الدومين المستهدف (مثال: example.com)"
        required: true
        type: string

jobs:
  vhost-recon:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install tools (bbot, ffuf, prips, jq)
        run: |
          pipx install bbot || pip install --user bbot
          go install -v github.com/ffuf/ffuf/v2@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          sudo apt-get update -y
          sudo apt-get install -y prips jq dnsutils

      # ---------- 1) تعداد الـ Subdomains باستخدام bbot ----------
      - name: Subdomain enumeration (bbot)
        run: |
          bbot -t "${{ inputs.domain }}" -f subdomain-enum -y -o bbot_output --name recon_scan

          SCAN_TXT=$(find bbot_output/recon_scan -maxdepth 1 -name "output.txt" | head -n1)
          if [ -f "$SCAN_TXT" ]; then
            grep -E "^DNS_NAME" "$SCAN_TXT" | awk '{print $2}' | sort -u > subs.txt
          fi

          echo "${{ inputs.domain }}" >> subs.txt
          sort -u -o subs.txt subs.txt

          echo "تم جمع $(wc -l < subs.txt) نطاق فرعي عبر bbot"

      # ---------- 2) اكتشاف الـ ASN تلقائياً من الدومين ----------
      - name: Auto-discover ASN from domain (bgpview.io)
        run: |
          DOMAIN="${{ inputs.domain }}"

          # نحل الدومين لعنوان IP
          IP=$(dig +short "$DOMAIN" A | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)

          if [ -z "$IP" ]; then
            echo "تعذر حل الدومين إلى IP، لا يمكن المتابعة لخطوة الـ ASN"
            : > asns.txt
            : > ranges.txt
          else
            echo "عنوان IP الرئيسي للدومين: $IP"

            # نستعلم عن معلومات الـ IP (يتضمن الـ ASN وصاحبه) عبر bgpview.io
            curl -s "https://api.bgpview.io/ip/${IP}" -o ip_info.json || echo '{}' > ip_info.json

            ASN=$(jq -r '.data.prefixes[0].asn.asn // empty' ip_info.json)
            ASN_NAME=$(jq -r '.data.prefixes[0].asn.name // empty' ip_info.json)

            if [ -z "$ASN" ]; then
              echo "لم يتم العثور على ASN مرتبط بهذا الـ IP"
              : > asns.txt
              : > ranges.txt
            else
              echo "تم اكتشاف ASN${ASN} (${ASN_NAME}) تلقائياً من الدومين"
              echo "$ASN" > asns.txt

              # نجلب كل نطاقات الـ IPv4 المسجلة تحت هذا الـ ASN
              curl -s "https://api.bgpview.io/asn/${ASN}/prefixes" -o asn_prefixes.json || echo '{}' > asn_prefixes.json
              jq -r '.data.ipv4_prefixes[].prefix' asn_prefixes.json > ranges.txt
            fi
          fi

          sort -u -o ranges.txt ranges.txt
          echo "تم جمع $(wc -l < ranges.txt) نطاق CIDR من ASN${ASN:-?}"
          cat ranges.txt

      - name: Expand CIDR ranges to IPs (prips)
        run: |
          : > ips.txt
          while read -r cidr; do
            [ -z "$cidr" ] && continue
            prips "$cidr" >> ips.txt 2>/dev/null || true
          done < ranges.txt
          sort -u -o ips.txt ips.txt
          echo "تم توليد $(wc -l < ips.txt) عنوان IP من نطاقات الـ ASN"

      # ---------- 3) اكتشاف الـ Vhosts عبر ffuf ----------
      - name: VHost fuzzing via Host header (ffuf)
        run: |
          mkdir -p results
          : > results/vhosts_found.txt

          while read -r ip; do
            [ -z "$ip" ] && continue
            echo "== Fuzzing Host header on $ip =="

            ffuf -u "https://${ip}/" \
                 -H "Host: FUZZ" \
                 -w subs.txt \
                 -t 50 \
                 -timeout 5 \
                 -mc all \
                 -fc 404 \
                 -of csv \
                 -o "results/${ip//./_}.csv" \
                 -s || true

            if [ -f "results/${ip//./_}.csv" ]; then
              tail -n +2 "results/${ip//./_}.csv" | awk -F',' -v ip="$ip" '{print ip","$0}' >> results/vhosts_found.txt
            fi
          done < ips.txt

          cp subs.txt asns.txt ranges.txt ips.txt results/ 2>/dev/null || true

      - name: Print summary
        run: |
          {
            echo "### نتائج Vhost Discovery"
            echo "- عدد الـ subdomains: $(wc -l < subs.txt)"
            echo "- ASN المكتشف: $(cat asns.txt 2>/dev/null || echo 'لا يوجد')"
            echo "- عدد نطاقات CIDR: $(wc -l < ranges.txt)"
            echo "- عدد عناوين الـ IP المفحوصة: $(wc -l < ips.txt)"
            echo '```'
            if [ -s results/vhosts_found.txt ]; then
              cat results/vhosts_found.txt
            else
              echo "لم يتم العثور على نتائج."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: vhost-recon-${{ inputs.domain }}
          path: results/
          retention-days: 14
